name: Deploy CN Creative Studio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract portfolio artwork archive
        run: |
          if [ -f portfolio-assets.zip ]; then unzip -o portfolio-assets.zip -d .; fi
      - name: Apply confirmed high-resolution replacements
        run: |
          if [ -f cn-creative-studio-highres-replacements.zip ]; then
            unzip -o cn-creative-studio-highres-replacements.zip -d .
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/work-06.jpg assets/work-07.jpg assets/work-11.jpg assets/work-13.jpg assets/work-17.jpg assets/work-20.jpg
            git rm -f cn-creative-studio-highres-replacements.zip
            if ! git diff --cached --quiet; then
              git commit -m "Apply confirmed high-resolution portfolio replacements"
              git push origin HEAD:main
            fi
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
