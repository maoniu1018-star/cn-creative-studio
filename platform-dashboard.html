<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CN Booking Studio｜店家後台</title>
<style>
:root{--ink:#382922;--muted:#806f63;--cream:#fbf7f1;--paper:#fffdf9;--gold:#b8955c;--line:#e8dcd0;--green:#53765e}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.6}.wrap{width:min(1000px,calc(100% - 30px));margin:auto}.top{padding:18px 0;border-bottom:1px solid var(--line)}.brand{font:700 20px Georgia,serif}.brand small{display:block;font:10px sans-serif;letter-spacing:.2em;color:var(--muted)}main{padding:28px 0 55px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;margin:15px 0}h1{font:700 clamp(26px,5vw,38px) Georgia,serif;margin:8px 0}h2{font-size:19px;margin:0 0 12px}.muted,.small{color:var(--muted)}.small{font-size:12px}.btn,input,select{font:inherit}.btn{border:1px solid var(--line);border-radius:999px;padding:9px 15px;background:white;color:var(--ink);cursor:pointer}.primary{background:var(--ink);color:white}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:13px;background:#f8efe8;border-radius:12px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--muted)}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px;font-size:13px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.tag{padding:3px 8px;border-radius:999px;background:#f4eadf;font-size:11px}.actions{display:flex;gap:6px;flex-wrap:wrap}.msg{padding:12px;background:#f6ebe3;border-radius:10px;margin-top:10px}.hidden{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:16px}.stats{gap:7px}.stat{padding:10px}}
</style></head>
<body><header class="top"><div class="wrap"><div class="brand">CN Booking Studio<small>BUSINESS DASHBOARD</small></div></div></header>
<main class="wrap"><a href="./platform.html" class="small">← 返回店家列表</a><h1 id="businessTitle">店家管理</h1><div id="status" class="muted">正在載入…</div>
<section class="panel"><h2>預約概況</h2><div class="stats"><div class="stat"><b id="total">0</b><span>全部預約</span></div><div class="stat"><b id="pending">0</b><span>待確認</span></div><div class="stat"><b id="confirmed">0</b><span>已確認</span></div></div></section>
<section class="panel"><h2>新增服務項目</h2><form id="serviceForm"><div class="grid"><div class="field"><label>服務名稱</label><input id="serviceName" required maxlength="80" placeholder="例如：初次諮詢"></div><div class="field"><label>服務時間（分鐘）</label><input id="duration" type="number" min="5" max="720" value="60" required></div></div><div class="grid"><div class="field"><label>價格（可留空）</label><input id="price" type="number" min="0" step="1" placeholder="不填表示未定價"></div><div class="field"><label>服務說明</label><input id="serviceDescription" maxlength="300" placeholder="簡短說明"></div></div><button class="btn primary">新增服務</button></form><div id="serviceMsg"></div><div id="servicesList" class="small" style="margin-top:12px"></div></section>
<section class="panel"><h2>預約管理</h2><div class="field"><label>日期篩選</label><input id="dateFilter" type="date"></div><div class="table"><table><thead><tr><th>日期／時間</th><th>顧客</th><th>聯絡方式</th><th>服務</th><th>狀態</th><th>操作</th></tr></thead><tbody id="bookingRows"></tbody></table></div><div id="empty" class="muted">目前沒有預約資料。</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id);let sb=null,businessId=new URLSearchParams(location.search).get('business'),services=[];
function cfg(){const u=sessionStorage.getItem('cn_sb_url'),k=sessionStorage.getItem('cn_sb_key');if(!u||!k){location.href='./platform.html';return false}sb=window.supabase.createClient(u,k);return true}
async function init(){if(!cfg())return;const {data:{session},error}=await sb.auth.getSession();if(error||!session){location.href='./platform.html';return}if(!businessId){location.href='./platform.html';return}const {data:biz,error:be}=await sb.from('businesses').select('id,name').eq('id',businessId).single();if(be){$('status').textContent='無法讀取店家資料：'+be.message;return}$('businessTitle').textContent=biz.name;$('status').textContent='已登入｜店家資料僅限此店家成員查看';await loadAll()}
async function loadAll(){const [s,b]=await Promise.all([sb.from('services').select('*').eq('business_id',businessId).order('created_at'),sb.from('bookings').select('id,customer_name,customer_contact,appointment_date,start_time,status,service_id,notes').eq('business_id',businessId).order('appointment_date',{ascending:false})]);if(s.error){$('serviceMsg').textContent=s.error.message;return}services=s.data||[];const names=Object.fromEntries(services.map(x=>[x.id,x.name]));$('servicesList').textContent=services.length?'目前服務：'+services.map(x=>x.name+'（'+x.duration_minutes+' 分鐘）').join('、'):'尚未新增服務項目';if(b.error){$('status').textContent='預約讀取失敗：'+b.error.message;return}const rows=b.data||[];$('total').textContent=rows.length;$('pending').textContent=rows.filter(x=>x.status==='pending').length;$('confirmed').textContent=rows.filter(x=>x.status==='confirmed').length;renderBookings(rows,names)}
function renderBookings(rows,names){const f=$('dateFilter').value;const filtered=rows.filter(r=>!f||r.appointment_date===f);$('bookingRows').innerHTML='';$('empty').classList.toggle('hidden',filtered.length>0);filtered.forEach(r=>{const tr=document.createElement('tr');const vals=[r.appointment_date+' '+String(r.start_time).slice(0,5),r.customer_name,r.customer_contact,names[r.service_id]||'服務項目',r.status];vals.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});const td=document.createElement('td'),wrap=document.createElement('div');wrap.className='actions';[['確認','confirmed'],['取消','cancelled'],['完成','completed']].forEach(([label,status])=>{const btn=document.createElement('button');btn.className='btn';btn.textContent=label;btn.addEventListener('click',async()=>{const {error}=await sb.from('bookings').update({status}).eq('id',r.id).eq('business_id',businessId);if(error)alert(error.message);else loadAll()});wrap.append(btn)});td.append(wrap);tr.append(td);$('bookingRows').append(tr)})}
$('serviceForm').addEventListener('submit',async e=>{e.preventDefault();const payload={business_id:businessId,name:$('serviceName').value.trim(),duration_minutes:Number($('duration').value),description:$('serviceDescription').value.trim(),price:$('price').value===''?null:Number($('price').value)};const {error}=await sb.from('services').insert(payload);if(error){$('serviceMsg').textContent=error.message;return}$('serviceForm').reset();$('duration').value=60;$('serviceMsg').textContent='服務已新增';loadAll()});
$('dateFilter').addEventListener('change',loadAll);init();
</script></body></html>
