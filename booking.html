<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f0e8">
<title>線上預約／設計需求｜CN Creative Studio</title>
<style>
:root{--cream:#f7f0e8;--paper:#fffaf5;--ink:#382922;--muted:#806f63;--pink:#efd5ce;--gold:#b18a5c;--line:#e7d9cd}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.65}.wrap{width:min(720px,calc(100% - 32px));margin:auto}.top{padding:26px 0 12px}.brand{font:700 22px Georgia,serif;letter-spacing:.03em}.brand small{display:block;font:11px sans-serif;letter-spacing:.2em;color:var(--muted)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:26px;margin:18px 0 34px;box-shadow:0 12px 32px #5033210a}.eyebrow{color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-size:11px}h1{font:700 clamp(27px,6vw,38px)/1.25 Georgia,"Noto Serif TC",serif;margin:8px 0 10px}p{color:var(--muted);margin:0 0 20px}.field{margin:17px 0}label{display:block;font-weight:650;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;color:var(--ink);font:inherit;font-size:16px}textarea{min-height:110px;resize:vertical}.hint{font-size:12px;color:var(--muted);margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{width:100%;border:0;border-radius:999px;padding:15px 18px;background:var(--ink);color:#fff8f0;font:700 16px inherit;cursor:pointer;margin-top:8px}.note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}.result{display:none;margin-top:18px;padding:16px;background:#f5e6df;border-radius:14px;white-space:pre-wrap;font-size:14px}.result.show{display:block}.back{color:var(--muted);text-decoration:none;font-size:14px}footer{text-align:center;color:var(--muted);font-size:12px;padding:0 0 30px}@media(max-width:520px){.panel{padding:20px}.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<header class="top"><a class="back" href="./index.html">← 返回作品集</a><div class="brand">CN Creative Studio<small>DESIGN · DIGITAL · CREATIVE</small></div></header>
<main class="panel"><div class="eyebrow">Booking & Project Inquiry</div><h1>預約諮詢／設計需求</h1><p>填寫以下資料，將需求整理後帶到 LINE 與我聯絡。送出不代表報價或預約已確認。</p>
<form id="bookingForm">
<div class="field"><label for="name">稱呼 *</label><input id="name" required placeholder="怎麼稱呼您？"></div>
<div class="grid"><div class="field"><label for="contact">聯絡方式 *</label><input id="contact" required placeholder="LINE 名稱或電話"></div><div class="field"><label for="service">需求項目 *</label><select id="service" required><option value="">請選擇</option><option>社群貼文／活動宣傳圖</option><option>AI 商品視覺／廣告圖</option><option>短影音／動態廣告</option><option>遊戲廣告／系列視覺</option><option>Logo／名片／封面</option><option>其他設計需求</option></select></div></div>
<div class="grid"><div class="field"><label for="budget">預算範圍</label><select id="budget"><option>尚未確定，請協助評估</option><option>NT$500–1,000</option><option>NT$1,000–3,000</option><option>NT$3,000–5,000</option><option>NT$5,000 以上</option></select></div><div class="field"><label for="deadline">希望完成日期</label><input id="deadline" type="date"></div></div>
<div class="field"><label for="detail">設計需求說明 *</label><textarea id="detail" required placeholder="例如：需要幾張圖、使用平台、尺寸、文案或其他想法"></textarea></div>
<div class="field"><label for="reference">參考圖片／作品連結（選填）</label><input id="reference" placeholder="可貼上圖片網址或參考連結"></div>
<button class="btn" type="submit">整理需求並前往 LINE ↗</button>
<div class="note">送出後會開啟 LINE 官方帳號；請將已複製的需求內容貼上傳送。</div>
</form><div class="result" id="result" role="status"></div></main>
<footer>© 2026 CN Creative Studio</footer></div>
<script>
const form=document.getElementById('bookingForm');
form.addEventListener('submit',async e=>{
 e.preventDefault();
 const v=id=>document.getElementById(id).value.trim();
 const msg=['【CN Creative Studio｜設計需求】','稱呼：'+v('name'),'聯絡方式：'+v('contact'),'需求項目：'+v('service'),'預算：'+v('budget'),'希望完成日期：'+(v('deadline')||'未指定'),'需求說明：'+v('detail'),'參考連結：'+(v('reference')||'無')].join('\n');
 const box=document.getElementById('result');box.textContent='需求內容已整理。若沒有自動複製，請長按下方文字複製，再貼到 LINE 傳送。\n\n'+msg;box.classList.add('show');
 try{await navigator.clipboard.writeText(msg);box.textContent='已複製需求內容！進入 LINE 後，請在聊天輸入框貼上並傳送。\n\n'+msg;}catch(err){}
 window.location.href='https://lin.ee/73F8KnE';
});
</script></body></html>
